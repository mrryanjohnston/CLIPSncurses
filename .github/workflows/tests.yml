name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------
  # The suite and the examples, against each CLIPS the wrappers claim to
  # build against: the 6.4.2 release, and the two Subversion branches at
  # the revisions the makefile pins.
  #
  # Nothing of CLIPS is in the repository: the 6.4.2 tarball is downloaded
  # from SourceForge and checked against its digest, the branches are
  # exported from SourceForge, and both are cached. No terminal is needed: tests/run.sh sends the screen to a
  # file, feeds the keys on stdin and pins TERM to xterm, which is exactly
  # the situation on a runner.
  # ---------------------------------------------------------------------
  test:
    name: test (CLIPS ${{ matrix.clips }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        clips: ['6.4.2', svn-6x, svn-7x]
    steps:
      - uses: actions/checkout@v7

      - name: Install the ncurses development headers
        run: sudo apt-get update && sudo apt-get install -y libncurses-dev

      - name: Install subversion
        if: startsWith(matrix.clips, 'svn-')
        run: sudo apt-get install -y subversion

      # The fetched source, not the tree built from it. The key is the
      # makefile and the fetch script, because that is where the revision
      # of a branch and the digest of the release are written: moving a pin
      # fetches again, and nothing else does.
      - name: Cache the CLIPS source
        uses: actions/cache@v6
        with:
          path: |
            clips_core_source_642.tar.gz
            vendor/clips-source
          key: deps-${{ matrix.clips }}-${{ hashFiles('makefile', 'scripts/fetch-clips.sh') }}
          restore-keys: deps-${{ matrix.clips }}-

      - name: Build
        run: make CLIPS_VERSION=${{ matrix.clips }}

      - name: Report what it built against
        run: |
          make print-clips CLIPS_VERSION=${{ matrix.clips }}
          dpkg-query -W -f='ncurses ${Version}\n' libncurses-dev

      - name: Run the test suite
        run: make CLIPS_VERSION=${{ matrix.clips }} test
